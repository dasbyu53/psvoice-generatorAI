<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PSvoice — Smart AI Voiceover Generator</title>
    <script>
      // GitHub Pages SPA redirect: keep the requested path so client-side
      // routing (e.g. /studio, /auth?returnTo=...) works on deep links.
      (function () {
        try {
          var redirect = sessionStorage.redirect;
          delete sessionStorage.redirect;
          if (redirect && redirect !== location.href) {
            history.replaceState(null, null, redirect);
          }
        } catch (e) {
          /* sessionStorage unavailable — ignore */
        }
      })();
    </script>
  </head>
  <body></body>
</html>
